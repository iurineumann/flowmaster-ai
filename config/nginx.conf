server {
    listen 80;
    server_name localhost;

    # Define o nome do host do seu backend (o nome do serviço no docker-compose)
    # Assumindo que seu serviço backend se chama 'backend'
    set $backend_host http://backend:8000;
    
    # Adiciona o index.html no contexto server
    index index.html; # Opcional se for SPA, mas pode ajudar em alguns casos

    # 1. Configuração para as rotas do Backend (Proxy Reverso)
    location /api/ {
        # O rewrite é ESSENCIAL se o backend não espera o prefixo /api/
        rewrite ^/api/(.*)$ /$1 break; 
        
        proxy_pass $backend_host;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Configuração para as rotas da Aplicação Frontend (SPA)
    location / {
        root /usr/share/nginx/html;
        # SOLUÇÃO PARA O REDIRECTION CYCLE (500) E FORBIDDEN (403)
        # Tenta:
        # 1. Servir o arquivo estático com o nome exato ($uri) (e.g., /vite.svg)
        # 2. Servir o arquivo como um diretório ($uri/)
        # 3. Se nada foi encontrado, serve o index.html (a chave final que previne o loop)
        try_files $uri $uri/ /index.html;
    }
}