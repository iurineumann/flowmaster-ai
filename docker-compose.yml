# docker-compose.yml
services:
  # 1. Serviço de Backend (Python/FastAPI)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./init_db.sh:/app/init_db.sh
      - ./alembic.ini:/app/alembic.ini # ✅ ADICIONE ESTA LINHA
      - ./alembic:/app/alembic # ✅ ADICIONE ESTA LINHA
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_started

    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: 1

    command: >
      sh -c "
        chmod +x /app/init_db.sh && \
        /app/init_db.sh && \
        echo '🚀 Iniciando Gunicorn...' && \
        /app/.venv/bin/gunicorn backend.main:app --workers 5 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000
      "

  # 2. Serviço de Banco de Dados (PostgreSQL)
  db:
    image: postgres:14-alpine
    restart: always
    ports:
      - "5432:5432"
    env_file:
      - .env
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data/
    healthcheck:
      # ✅ CORREÇÃO: Usa 'CMD' e especifica o DB com -d
      test:
        ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Serviço de Cache (Redis)
  redis:
    image: redis:7-alpine
    container_name: flowmaster-ai-redis-1
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - ./.data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Mensageria (RabbitMQ)
  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: always
    ports:
      - "5672:5672" # Porta do protocolo AMQP
      - "15672:15672" # Interface de Gerenciamento (UI)
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - ./rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 4. Serviço de Frontend (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:443"
      - "3001:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/certs:/etc/nginx/certs
    depends_on:
      - backend

volumes:
  flowmaster-ai-postgres-data:
  flowmaster-ai-redis-data:
