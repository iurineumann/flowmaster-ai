# alembic.ini

[alembic]
# Caminho para o script de migração (relativo a este arquivo)
script_location = alembic

# Template para nomes de arquivos de migração
file_template = %%(rev)s_%%(slug)s

# URL de conexão com o banco de dados.
# Nós vamos lê-la do .env usando o env.py, então deixamos em branco aqui.
# sqlalchemy.url = 

# Configuração para o 'post_write_hook' (formatação automática)
[post_write_hooks]
#hooks = autopep8
autopep8.type = exec
autopep8.entrypoint = autopep8
autopep8.options = --in-place

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S